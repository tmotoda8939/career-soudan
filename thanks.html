<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>お申込みありがとうございます｜無料キャリア相談</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f3;--ink:#2a2f45;--ink-dim:#6b7088;--navy:#1f2a5a;--coral:#ef4f6c;--line:#f0e2d8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.8;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 60px;text-align:center}
.mark{width:64px;height:64px;border-radius:50%;background:var(--coral);margin:0 auto 16px;position:relative}
.mark::after{content:"";position:absolute;left:24px;top:14px;width:14px;height:26px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
h1{font-size:22px;color:var(--navy);line-height:1.5;margin-bottom:12px}
p{font-size:14.5px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:22px 0;text-align:left}
.box h2{font-size:15px;color:var(--navy);margin-bottom:6px}
.box ol{padding-left:1.3em;font-size:14px}
img{max-width:100%;border-radius:12px;margin-top:8px}
a{color:var(--navy);font-weight:700}
small{display:block;color:var(--ink-dim);font-size:12px;margin-top:20px}
</style>
<script>
  // index.html と同じ計測IDを設定すると、完了ページの表示も計測されます
  window.GA_ID = '';
  if (window.GA_ID) {
    var s=document.createElement('script'); s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+window.GA_ID; document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments);}; gtag('js',new Date()); gtag('config',window.GA_ID);
  }
</script>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true"></div>
    <h1>お申込みありがとうございます</h1>
    <p>担当のキャリアアドバイザーから、<br>原則1営業日以内にご連絡します。</p>
    <div class="box">
      <h2>このあとの流れ</h2>
      <ol>
        <li>担当者からお電話またはメールでご連絡</li>
        <li>面談の日時を決定（オンライン可・約60分）</li>
        <li>キャリア面談で、ご希望をじっくりお聞きします</li>
      </ol>
    </div>
    <p>知らない番号からの着信は、担当者の可能性があります。<br>出られなかった場合も、折り返しご連絡します。</p>
    <img src="img/manga_cta.jpg" width="900" height="1187" alt="笑顔の主人公とキャリアアドバイザー">
    <p style="margin-top:18px"><a href="index.html">トップページへ戻る</a></p>
    <small>運営：株式会社Clutch</small>
  </div>
</body>
</html>
